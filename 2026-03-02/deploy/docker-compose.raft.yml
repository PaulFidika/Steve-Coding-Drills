  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      raft1:
        condition: service_healthy
      raft2:
        condition: service_healthy
      raft3:
        condition: service_healthy
      raft4:
        condition: service_healthy
      raft5:
        condition: service_healthy
      raft6:
        condition: service_healthy
      raft7:
        condition: service_healthy
      raft8:
        condition: service_healthy
      raft9:
        condition: service_healthy
    ports:
      - "18080:80"
    volumes:
      - ./nginx/raft.conf:/etc/nginx/conf.d/default.conf:ro
    cpus: "${LB_CPUS:-1.00}"
    mem_limit: "${LB_MEM:-128m}"

  loadgen:
    build:
      context: ..
      dockerfile: Dockerfile
    image: raft-garnet-bench:latest
    command: ["sleep", "infinity"]
    depends_on:
      lb:
        condition: service_started
    cpus: "${LOADGEN_CPUS:-1.00}"
    mem_limit: "${LOADGEN_MEM:-512m}"
    volumes:
      - ../results:/results

