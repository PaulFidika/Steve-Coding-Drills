services:
  raft1:
    <<: &raft_app
      image: raft-garnet-bench:latest
      restart: unless-stopped
      expose:
        - "8080"
        - "6300"
      cpus: "${vCPUS:-1.00}"
      mem_limit: "${APP_MEM:-256m}"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
        interval: 5s
        timeout: 2s
        retries: 30
      environment:
        BACKEND: raft
        HTTP_ADDR: ":8080"
        SHARD_COUNT: "${SHARD_COUNT:-3}"
        RAFT_REPLICATION_FACTOR: "${RAFT_REPLICATION_FACTOR:-3}"
        RAFT_PEERS: "1=raft1:6300,2=raft2:6300,3=raft3:6300,4=raft4:6300,5=raft5:6300,6=raft6:6300,7=raft7:6300,8=raft8:6300,9=raft9:6300"
        HTTP_PEERS: "1=http://raft1:8080,2=http://raft2:8080,3=http://raft3:8080,4=http://raft4:8080,5=http://raft5:8080,6=http://raft6:8080,7=http://raft7:8080,8=http://raft8:8080,9=http://raft9:8080"
    environment:
      BACKEND: raft
      HTTP_ADDR: ":8080"
      SHARD_COUNT: "${SHARD_COUNT:-3}"
      RAFT_REPLICATION_FACTOR: "${RAFT_REPLICATION_FACTOR:-3}"
      RAFT_PEERS: "1=raft1:6300,2=raft2:6300,3=raft3:6300,4=raft4:6300,5=raft5:6300,6=raft6:6300,7=raft7:6300,8=raft8:6300,9=raft9:6300"
      HTTP_PEERS: "1=http://raft1:8080,2=http://raft2:8080,3=http://raft3:8080,4=http://raft4:8080,5=http://raft5:8080,6=http://raft6:8080,7=http://raft7:8080,8=http://raft8:8080,9=http://raft9:8080"
      NODE_ID: "1"
      RAFT_ADDR: "raft1:6300"
      RAFT_DATA_DIR: "/data"
    volumes:
      - raft1-data:/data

  raft2:
