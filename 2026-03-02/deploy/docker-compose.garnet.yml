services:
  garnet:
    image: ghcr.io/microsoft/garnet:latest
    restart: unless-stopped
    expose:
      - "6379"
    cpus: "${GARNET_CPUS:-1.00}"
    mem_limit: "${GARNET_MEM:-512m}"

  gweb1:
    <<: &gweb_app
      image: raft-garnet-bench:latest
      restart: unless-stopped
      expose:
        - "8080"
      cpus: "${vCPUS:-1.00}"
      mem_limit: "${APP_MEM:-256m}"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
        interval: 5s
        timeout: 2s
        retries: 30
      environment:
        BACKEND: garnet
        HTTP_ADDR: ":8080"
        GARNET_ADDR: "garnet:6379"
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "1"
      GARNET_ADDR: "garnet:6379"

  gweb2:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "2"
      GARNET_ADDR: "garnet:6379"

  gweb3:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "3"
      GARNET_ADDR: "garnet:6379"

  gweb4:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "4"
      GARNET_ADDR: "garnet:6379"

  gweb5:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "5"
      GARNET_ADDR: "garnet:6379"

  gweb6:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "6"
      GARNET_ADDR: "garnet:6379"

  gweb7:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "7"
      GARNET_ADDR: "garnet:6379"

  gweb8:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "8"
      GARNET_ADDR: "garnet:6379"

  gweb9:
    <<: *gweb_app
    environment:
      BACKEND: garnet
      HTTP_ADDR: ":8080"
      NODE_ID: "9"
      GARNET_ADDR: "garnet:6379"

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      garnet:
        condition: service_started
      gweb1:
        condition: service_healthy
      gweb2:
        condition: service_healthy
      gweb3:
        condition: service_healthy
      gweb4:
        condition: service_healthy
      gweb5:
        condition: service_healthy
      gweb6:
        condition: service_healthy
      gweb7:
        condition: service_healthy
      gweb8:
        condition: service_healthy
      gweb9:
        condition: service_healthy
    ports:
      - "28080:80"
    volumes:
      - ./nginx/garnet.conf:/etc/nginx/conf.d/default.conf:ro
    cpus: "${LB_CPUS:-1.00}"
    mem_limit: "${LB_MEM:-128m}"

  loadgen:
    build:
      context: ..
      dockerfile: Dockerfile
    image: raft-garnet-bench:latest
    command: ["sleep", "infinity"]
    depends_on:
      lb:
        condition: service_started
    cpus: "${LOADGEN_CPUS:-1.00}"
    mem_limit: "${LOADGEN_MEM:-512m}"
    volumes:
      - ../results:/results
